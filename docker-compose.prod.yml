version: '3.8'

# VIGILANCE Distributed Deception & Threat Intelligence Platform
# Production Compose Orchestration (Azure / Cloud Host)

services:
  # ── 1. MongoDB 7.0 Evidence Store ───────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: vigilance-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_DATABASE: vigilance_evidence
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vigilance-net

  # ── 2. Apache Kafka in KRaft Mode ───────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vigilance-kafka-prod
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: '4L622nShTUiTwyTgahAbMW'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 | grep -q 'id: 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - vigilance-net

  # ── 3. Kafka Topic Initializer ──────────────────────────────────────────────
  kafka-init-topics:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vigilance-kafka-init-prod
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Provisioning VIGILANCE Kafka Topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-attacks --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic enriched-attacks --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic alerts --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-attacks-dlq --partitions 1 --replication-factor 1
      echo 'Topics ready.'
      "
    networks:
      - vigilance-net

  # ── 4. PostgreSQL 16 Store ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vigilance-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigilance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilance_password}
      POSTGRES_DB: ${POSTGRES_DB:-vigilance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigilance_user} -d ${POSTGRES_DB:-vigilance_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vigilance-net

  # ── 5. Ingestion Worker ─────────────────────────────────────────────────────
  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: vigilance-ingestion-prod
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vigilance_user}:${POSTGRES_PASSWORD:-vigilance_password}@postgres:5432/${POSTGRES_DB:-vigilance_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: vigilance-ingestion-group
    networks:
      - vigilance-net

  # ── 6. FastAPI Analytical REST & SSE Backend ────────────────────────────────
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: vigilance-backend-prod
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vigilance_user}:${POSTGRES_PASSWORD:-vigilance_password}@postgres:5432/${POSTGRES_DB:-vigilance_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CORS_ORIGINS: "[\"*\"]"
    networks:
      - vigilance-net

  # ── 7. Nowhere Esports Decoy Intranet Sensor ────────────────────────────────
  nowhere-intranet:
    build:
      context: .
      dockerfile: apps/nowhere-intranet/Dockerfile
    container_name: nowhere-intranet-prod
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: vigilance_evidence
      RESEND_API_KEY: ${RESEND_API_KEY}
    networks:
      - vigilance-net

  # ── 8. Nginx Reverse Proxy (Front Door) ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vigilance-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nowhere-intranet
      - backend
    networks:
      - vigilance-net

networks:
  vigilance-net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  kafka_data:
    driver: local
  postgres_data:
    driver: local

