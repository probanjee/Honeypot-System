version: '3.8'

# VIGILANCE Distributed Deception & Threat Intelligence Platform
# Phase 2: Local Development Environment (KRaft Kafka + MongoDB)

services:
  # ── 1. MongoDB 7.0 Evidence Store ───────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: vigilance-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vigilance_evidence
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vigilance-net

  # ── 2. Apache Kafka 3.7+ in KRaft Mode (ZooKeeper-less) ─────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vigilance-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: '4L622nShTUiTwyTgahAbMW'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 | grep -q 'id: 1'"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - vigilance-net

  # ── 3. Kafka Topic Initializer ──────────────────────────────────────────────
  kafka-init-topics:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vigilance-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Creating VIGILANCE Kafka Topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-attacks --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic enriched-attacks --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic alerts --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-attacks-dlq --partitions 1 --replication-factor 1
      echo 'VIGILANCE Topics successfully created:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - vigilance-net

networks:
  vigilance-net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  kafka_data:
    driver: local
