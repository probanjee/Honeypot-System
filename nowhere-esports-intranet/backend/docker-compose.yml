version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder   # Use builder stage for dev (has ts-node-dev)
    container_name: nowhere-esports-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - LOG_PRETTY=true
    volumes:
      # Mount source for hot-reload in development
      - ./src:/app/src:ro
    command: npm run dev
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Optional: Postgres local dev (use instead of Supabase cloud) ───────────
