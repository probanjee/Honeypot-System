<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Team – Nowhere Esports</title>
  <meta name="description" content="View your team roster, stats, and upcoming scrims" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/animations.css" />
  <style>
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      transition: var(--transition);
      cursor: pointer;
    }
    .player-card:hover {
      border-color: var(--border-glow);
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    }
    .avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; font-family: 'Rajdhani', sans-serif;
      margin: 0 auto 16px;
      border: 2px solid rgba(0,229,255,0.3);
      box-shadow: 0 0 20px rgba(0,229,255,0.15);
    }
    .player-ign { font-size: 17px; font-weight: 700; font-family: 'Rajdhani', sans-serif; letter-spacing: 0.05em; }
    .player-role { font-size: 11px; color: var(--text-muted); margin-top: 4px; letter-spacing: 0.08em; text-transform: uppercase; }
    .player-stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-top: 16px; padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .stat-item { text-align: center; }
    .stat-val { font-size: 18px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--neon-cyan); }
    .stat-lbl { font-size: 10px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.06em; }
    .scrim-card {
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex; align-items: center; gap: 16px;
    }
    .section-title {
      font-size: 18px; font-weight: 700; font-family: 'Rajdhani', sans-serif;
      letter-spacing: 0.05em; margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content fade-in">
      <div class="page-header">
        <div>
          <h1 style="font-size: 28px; letter-spacing: 0.05em;">MY TEAM</h1>
          <p class="text-secondary" style="margin-top: 4px; font-size: 13px;">Roster, stats, and scrims</p>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <span class="badge badge-success" id="team-badge">CS2 Division A</span>
        </div>
      </div>

      <!-- Team Summary Stats -->
      <div class="grid-4 stagger" style="margin-bottom: 32px;" id="team-stats"></div>

      <!-- Roster -->
      <div class="section-title">
        <span style="color: var(--neon-cyan);">⬡</span> ROSTER
      </div>
      <div class="player-grid stagger" id="roster"></div>

      <!-- Upcoming Scrims -->
      <div class="section-title" style="margin-top: 32px;">
        <span style="color: var(--neon-purple);">⬡</span> UPCOMING SCRIMS
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px;" id="scrims"></div>
    </main>
  </div>

  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    const ROSTER = [
      { ign: 'ShadowByte',   name: 'Arjun M.',    role: 'Entry Fragger',   kda: 2.8, hs: 62, rating: 1.34, initial: 'S' },
      { ign: 'NullVoid',     name: 'Priya K.',     role: 'In-Game Leader',  kda: 2.1, hs: 48, rating: 1.21, initial: 'N' },
      { ign: 'GlitchX',     name: 'Rahul V.',     role: 'AWPer',           kda: 3.2, hs: 71, rating: 1.42, initial: 'G' },
      { ign: 'PacketLoss',   name: 'Sneha R.',     role: 'Support',         kda: 1.9, hs: 44, rating: 1.15, initial: 'P' },
      { ign: 'RootKit',      name: 'Dev S.',       role: 'Lurker',          kda: 2.4, hs: 56, rating: 1.28, initial: 'R' },
    ];

    const TEAM_STATS = [
      { label: 'Win Rate',    value: '73%',  icon: '🏆', color: 'var(--neon-gold)' },
      { label: 'Maps Played', value: '41',   icon: '🗺️', color: 'var(--neon-cyan)' },
      { label: 'Avg Rating',  value: '1.28', icon: '⭐', color: 'var(--neon-green)' },
      { label: 'Ranking',     value: '#3',   icon: '📊', color: 'var(--neon-purple)' },
    ];

    const SCRIMS = [
      { opponent: 'Team Omega',  date: 'May 11 · 15:00 IST', game: 'CS2', mode: 'Bo3' },
      { opponent: 'Hex Esports', date: 'May 13 · 14:00 IST', game: 'CS2', mode: 'Bo1' },
      { opponent: 'Zero Hour',   date: 'May 14 · 16:00 IST', game: 'CS2', mode: 'Bo3' },
    ];

    // Team stats
    document.getElementById('team-stats').innerHTML = TEAM_STATS.map(s => `
      <div class="glass p-20 hover-float">
        <div style="font-size: 28px; margin-bottom: 8px;">${s.icon}</div>
        <div style="font-size: 28px; font-weight: 800; font-family: 'Rajdhani', sans-serif; color: ${s.color};">${s.value}</div>
        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.08em;">${s.label}</div>
      </div>
    `).join('');

    // Roster cards
    document.getElementById('roster').innerHTML = ROSTER.map(p => `
      <div class="player-card">
        <div class="avatar">${p.initial}</div>
        <div class="player-ign">${p.ign}</div>
        <div class="player-role">${p.role}</div>
        <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">${p.name}</div>
        <div class="player-stats">
          <div class="stat-item">
            <div class="stat-val">${p.kda}</div>
            <div class="stat-lbl">KDA</div>
          </div>
          <div class="stat-item">
            <div class="stat-val" style="color: var(--neon-pink);">${p.hs}%</div>
            <div class="stat-lbl">HS%</div>
          </div>
          <div class="stat-item">
            <div class="stat-val" style="color: var(--neon-gold);">${p.rating}</div>
            <div class="stat-lbl">RATING</div>
          </div>
        </div>
      </div>
    `).join('');

    // Scrims
    document.getElementById('scrims').innerHTML = SCRIMS.map(s => `
      <div class="scrim-card">
        <span style="font-size: 20px;">🎮</span>
        <div style="flex: 1;">
          <div style="font-weight: 700; font-family: 'Rajdhani', sans-serif; font-size: 15px;">vs ${s.opponent}</div>
          <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">${s.date}</div>
        </div>
        <span class="match-game-tag" style="background: rgba(168,85,247,0.12); color: var(--neon-purple); border: 1px solid rgba(168,85,247,0.25); font-size: 11px; padding: 3px 10px; border-radius: 6px; font-weight: 600;">${s.game}</span>
        <span class="badge badge-info">${s.mode}</span>
        <button class="btn btn-outline" style="padding: 6px 16px; font-size: 12px;">📋 Details</button>
      </div>
    `).join('');
  </script>
</body>
</html>
