<source>
  @type tail
  path /var/log/honeypots/*.log
  pos_file /var/log/td-agent/honeypot.log.pos
  tag honeypot.logs
  <parse>
    @type json
  </parse>
</source>

<match honeypot.logs>
  @type kafka2
  brokers kafka:29092
  use_event_time true
  <format>
    @type json
  </format>
  <buffer>
    flush_interval 5s
  </buffer>
  topic_key raw-attacks
  default_topic raw-attacks
</match>
