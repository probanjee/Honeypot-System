apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeypot-backend
  namespace: honeypot
  labels:
    app: honeypot-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: honeypot-backend
  template:
    metadata:
      labels:
        app: honeypot-backend
    spec:
      containers:
        - name: backend
          image: honeypot-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: honeypot-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: honeypot-secrets
                  key: redis-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/analytics/summary
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/analytics/summary
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: honeypot
spec:
  selector:
    app: honeypot-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
