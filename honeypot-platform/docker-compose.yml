version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: honeypot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../nowhere-esports-intranet/backend/database/init_postgresql.sql:/docker-entrypoint-initdb.d/init_postgresql.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d honeypot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  backend:
    build: ./services/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/honeypot
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8000:8000"

  http-honeypot:
    build: ./services/honeypots/http
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      - kafka

  ssh-honeypot:
    build: ./services/honeypots/ssh
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "2222:2222"
    depends_on:
      - kafka

  ingestion:
    build: ./services/ingestion
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/honeypot
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka
      - postgres

  analytics:
    build: ./services/analytics
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - kafka
      - redis

  threat-intel:
    build: ./services/threat_intel
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY}
    depends_on:
      - kafka

  alerting:
    build: ./services/alerting
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    depends_on:
      - kafka

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

  nowhere-esports:
    build:
      context: ../nowhere-esports-intranet/backend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://user:password@postgres:5432/honeypot
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: honeypot
      DB_USER: user
      DB_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: nowhere-esports-super-secret-jwt-key-2026
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  postgres_data:
