name: VIGILANCE CI & Quality Assurance

on:
  push:
    branches: [ main, test-branch ]
  pull_request:
    branches: [ main ]

jobs:
  test-intranet:
    name: Nowhere Intranet Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/nowhere-intranet/package.json
      - name: Install dependencies
        run: npm --prefix apps/nowhere-intranet install
      - name: Build TypeScript & Assets
        run: npm --prefix apps/nowhere-intranet run build
      - name: Run Vitest Unit Tests
        run: npm --prefix apps/nowhere-intranet test

  test-dashboard:
    name: SOC Dashboard Tests & Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package.json
      - name: Install dependencies
        run: npm --prefix apps/dashboard install
      - name: Run Vitest Tests
        run: npm --prefix apps/dashboard test -- --run
      - name: Verify Production Build
        run: npm --prefix apps/dashboard run build

  test-backend:
    name: FastAPI Backend API Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r services/backend/requirements.txt
      - name: Run Pytest Suite
        run: |
          cd services/backend
          pytest -q

  test-ingestion:
    name: Kafka Ingestion Worker Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/ingestion/requirements.txt
      - name: Install dependencies
        run: pip install -r services/ingestion/requirements.txt
      - name: Run Pytest Suite
        run: |
          cd services/ingestion
          pytest -q
